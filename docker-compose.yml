services:
  db:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-tripweaver}
      POSTGRES_USER: ${DB_USER:-tripweaver}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tripweaver}
    ports:
      - "5433:5432"
    volumes:
      - tripweaver-db:/var/lib/postgresql/data
      - ./scripts/db-init-noop.sh:/docker-entrypoint-initdb.d/10_postgis.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tripweaver}"]
      interval: 5s
      retries: 10

  # Road routing. Prepare data first: scripts/osrm-prepare.sh. Start: docker compose --profile routing up -d osrm
  osrm:
    profiles: ["routing"]
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    command: osrm-routed --algorithm ch --max-table-size 1000 /data/western-zone.osrm
    volumes:
      - ./data/osrm:/data:ro
    ports:
      - "5001:5000"

volumes:
  tripweaver-db:
