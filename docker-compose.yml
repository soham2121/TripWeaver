services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-tripweaver}
      POSTGRES_USER: ${DB_USER:-tripweaver}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tripweaver}
    ports:
      - "5433:5432"
    volumes:
      - tripweaver-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tripweaver}"]
      interval: 5s
      retries: 10

volumes:
  tripweaver-db:
