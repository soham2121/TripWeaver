spring:
  application:
    name: tripweaver
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/tripweaver}
    username: ${DB_USER:tripweaver}
    password: ${DB_PASSWORD:tripweaver}
  flyway:
    enabled: true

server:
  port: ${PORT:8088}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
