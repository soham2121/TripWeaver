spring:
  application:
    name: tripweaver
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/tripweaver}
    username: ${DB_USER:tripweaver}
    password: ${DB_PASSWORD:tripweaver}
  flyway:
    enabled: true

server:
  port: ${PORT:8088}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

tripweaver:
  routing:
    # Self-hosted OSRM (docker compose --profile routing up -d osrm). Unreachable = labelled straight-line estimates.
    osrm-url: ${OSRM_BASE_URL:http://127.0.0.1:5001}
    timeout-ms: 5000
