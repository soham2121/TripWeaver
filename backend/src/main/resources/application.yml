spring:
  application:
    name: tripweaver
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/tripweaver}
    username: ${DB_USER:tripweaver}
    password: ${DB_PASSWORD:tripweaver}
  flyway:
    enabled: true

server:
  port: ${PORT:8088}
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

tripweaver:
  demo:
    # Set DEMO_PASSWORD to create the demo users asha, ravi and meera. Unset = no demo users.
    password: ${DEMO_PASSWORD:}
  rate-limit:
    # Requests per minute per IP on public share links and on sign-in.
    per-minute: 60
  routing:
    # Self-hosted OSRM (docker compose --profile routing up -d osrm). Unreachable = labelled straight-line estimates.
    osrm-url: ${OSRM_BASE_URL:http://127.0.0.1:5001}
    timeout-ms: 5000
